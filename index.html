<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinder Hub | Painel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background: #050505; color: #fff; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden; background: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #000 70%);
        }
        .container {
            background: rgba(15, 15, 15, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px; border-radius: 24px; width: 100%; max-width: 420px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        
        h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
        p.sub { color: #888; font-size: 13px; margin-bottom: 25px; font-weight: 400; }
        
        input, select {
            width: 100%; padding: 14px 16px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; color: #fff; font-size: 14px; outline: none; transition: all 0.3s;
            margin-bottom: 12px; font-family: 'Inter', sans-serif;
        }
        input:focus, select:focus { border-color: #fff; background: rgba(255, 255, 255, 0.08); }
        
        button {
            width: 100%; padding: 14px; background: #fff; color: #000; border: none; border-radius: 12px;
            font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-bottom: 10px;
        }
        button:hover { background: #d4d4d4; transform: scale(1.02); }
        button:active { transform: scale(0.98); }
        button.secondary { background: transparent; border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; }
        button.secondary:hover { background: rgba(255, 255, 255, 0.1); }
        button.danger { background: #ff3333; color: #fff; }
        button.danger:hover { background: #cc0000; }
        
        .hidden { display: none !important; }
        .view { animation: fadeIn 0.4s ease-out; }
        
        .key-box { 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); padding: 12px 16px; 
            border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
            animation: slideIn 0.3s ease-out;
        }
        .key-box.used { opacity: 0.4; border-left: 3px solid #555; }
        .key-code { font-family: monospace; font-size: 14px; color: #fff; font-weight: 600; }
        .key-time { font-size: 11px; color: #888; }
        
        .keys-container { max-height: 250px; overflow-y: auto; margin-top: 20px; padding-right: 5px; }
        .keys-container::-webkit-scrollbar { width: 4px; }
        .keys-container::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: #fff; color: #000; padding: 12px 24px; border-radius: 50px; font-weight: 600; font-size: 13px;
            opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div class="container">
        <!-- REGISTRO -->
        <div id="view-register" class="view">
            <h1>Identificação</h1>
            <p class="sub">Digite seu usuário para acessar o painel.</p>
            <input type="text" id="input-user" placeholder="Ex: farmcontagg1">
            <button onclick="registerUser()">Registrar</button>
        </div>

        <!-- LOGIN ADMIN -->
        <div id="view-admin-login" class="view hidden">
            <h1>Acesso Restrito</h1>
            <p class="sub">Área exclusiva do Criador.</p>
            <input type="password" id="input-pass" placeholder="Senha de entrada">
            <button onclick="loginAdmin()">Entrar</button>
            <button class="secondary" onclick="skipAdmin()">Entrar como Usuário Comum</button>
        </div>

        <!-- PAINEL ADMIN -->
        <div id="view-admin" class="view hidden">
            <h1>Painel do Criador</h1>
            <p class="sub">Gerencie as keys do Cinder Hub.</p>
            
            <div style="display: flex; gap: 10px;">
                <select id="select-time" style="flex: 2;">
                    <option value="3600">1 Hora</option>
                    <option value="36000">10 Horas</option>
                    <option value="86400">24 Horas</option>
                    <option value="259200">3 Dias</option>
                    <option value="432000">5 Dias</option>
                    <option value="864000">10 Dias</option>
                    <option value="2592000">30 Dias</option>
                    <option value="999999999">Permanente</option>
                </select>
                <button onclick="generateKey()" style="flex: 1; margin-bottom: 12px;">Gerar</button>
            </div>
            
            <button class="danger" onclick="resetKeys()">Resetar Todas as Keys</button>

            <div class="keys-container" id="keys-list">
                <!-- Keys vão aparecer aqui -->
            </div>
            
            <button class="secondary" onclick="logout()" style="margin-top: 20px;">Sair</button>
        </div>

        <!-- PAINEL USUÁRIO -->
        <div id="view-user" class="view hidden">
            <h1>Bem-vindo, <span id="user-name-display"></span></h1>
            <p class="sub">Copie a key gerada pelo seu líder e coloque no jogo.</p>
            <button class="secondary" onclick="logout()">Sair</button>
        </div>
    </div>

    <div class="toast" id="toast">Aviso</div>

    <script>
        // ==========================================
        // BLOB ID CONFIGURADO
        // ==========================================
        const BLOB_ID = "01a1a914-5de0-7af5-9c8b-d1e035dadafa";
        const API_URL = `https://jsonblob.com/${BLOB_ID}`;
        const ADMIN_PASS = "552904";
        // ==========================================

        let currentUser = localStorage.getItem('cinder_user');
        let isAdmin = localStorage.getItem('cinder_admin') === 'true';

        window.onload = () => {
            if (currentUser) {
                document.getElementById('user-name-display').innerText = currentUser;
                if (isAdmin) { showView('view-admin'); loadKeys(); }
                else { showView('view-user'); }
            } else {
                showView('view-register');
            }
        };

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function showView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function registerUser() {
            const name = document.getElementById('input-user').value.trim();
            if (!name) return showToast("Digite um nome válido!");
            
            localStorage.setItem('cinder_user', name);
            currentUser = name;
            document.getElementById('user-name-display').innerText = name;

            if (!localStorage.getItem('cinder_first_time')) {
                localStorage.setItem('cinder_first_time', 'true');
                showView('view-admin-login');
            } else {
                showView('view-user');
            }
        }

        function loginAdmin() {
            const pass = document.getElementById('input-pass').value;
            if (pass === ADMIN_PASS) {
                isAdmin = true;
                localStorage.setItem('cinder_admin', 'true');
                showView('view-admin');
                loadKeys();
            } else {
                showToast("Senha incorreta!");
            }
        }

        function skipAdmin() {
            showView('view-user');
        }

        function logout() {
            localStorage.removeItem('cinder_user');
            localStorage.removeItem('cinder_admin');
            location.reload();
        }

        // ==========================================
        // LÓGICA DE DADOS (JSONBLOB)
        // ==========================================
        async function fetchDatabase() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                return data || { keys: [] };
            } catch (e) {
                return { keys: [] };
            }
        }

        async function saveDatabase(data) {
            try {
                const res = await fetch(API_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                return res.ok;
            } catch (e) {
                return false;
            }
        }

        async function generateKey() {
            const duration = parseInt(document.getElementById('select-time').value);
            const key = "CINDER-" + Math.random().toString(36).substring(2, 8).toUpperCase() + "-" + Math.random().toString(36).substring(2, 6).toUpperCase();
            
            const db = await fetchDatabase();
            db.keys.push({ key: key, duration: duration, used: false, created: Date.now() });
            
            if (await saveDatabase(db)) {
                showToast("Key Gerada: " + key);
                loadKeys();
            } else {
                showToast("Erro ao salvar. Verifique o console.");
            }
        }

        async function resetKeys() {
            if (confirm("Tem certeza que deseja apagar TODAS as keys?")) {
                await saveDatabase({ keys: [] });
                loadKeys();
                showToast("Todas as keys foram resetadas.");
            }
        }

        async function loadKeys() {
            const container = document.getElementById('keys-list');
            container.innerHTML = '<p style="color:#555; text-align:center; font-size:12px;">Carregando...</p>';
            
            const db = await fetchDatabase();
            container.innerHTML = '';

            if (!db.keys || db.keys.length === 0) {
                container.innerHTML = '<p style="color:#555; text-align:center; font-size:12px;">Nenhuma key criada.</p>';
                return;
            }

            const sorted = db.keys.sort((a, b) => b.created - a.created);
            
            sorted.forEach(k => {
                const div = document.createElement('div');
                div.className = "key-box " + (k.used ? "used" : "");
                
                let tempoStr = k.duration === 999999999 ? "Permanente" : (k.duration / 3600) + " Horas";
                
                div.innerHTML = `
                    <div>
                        <div class="key-code">${k.key}</div>
                        <div class="key-time">${tempoStr}</div>
                    </div>
                    <div style="font-size: 11px; font-weight: 600; color: ${k.used ? '#888' : '#00ff88'}">
                        ${k.used ? 'USADA' : 'LIVRE'}
                    </div>
                `;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
